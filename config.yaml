# vLLM Server Configuration
# Central config for the unified inference gateway

server:
  host: "0.0.0.0"       # Listen on all interfaces (ZeroTier + localhost)
  port: 8000
  log_level: "info"

zerotier:
  network_id: "3b19b3a716937e29"
  enabled: true

# vLLM server settings
vllm:
  # Primary model for Hermes/Watson roles
  default_model: "Qwen/Qwen3.5-27B"   # HF model ID (will download on first run)
  quantization: "awq"                  # AWQ or gptq for fitting 27B in 16GB VRAM
  gpu_memory_utilization: 0.90
  max_model_len: 65536                 # 64k context window
  dtype: "auto"                        # auto detects best precision
  tensor_parallel_size: 1
  enable_prefix_caching: true          # Speed up repeated prompts (system messages)
  
  # Alternative: use a GGUF-compatible quantized model via vLLM
  # model: "/path/to/Qwen3.6-27B-Q3_K_M.gguf"  # If using local GGUF
  
  # Generation defaults
  default_sampling_params:
    temperature: 0.7
    top_p: 0.9
    max_tokens: 8192
    stop: []

# Model routing per role
roles:
  WatsonMain:
    model: "default"
    temperature: 0.7
    max_tokens: 8192
  WatsonMemory:
    model: "default"
    temperature: 0.3
    max_tokens: 4096
  WatsonReviewer:
    model: "default"
    temperature: 0.5
    max_tokens: 4096
  WatsonDev:
    model: "default"
    temperature: 0.7
    max_tokens: 8192
  iTrader:
    model: "default"
    temperature: 0.5
    max_tokens: 2048

# Inference provider config (for Hermes adapter)
inference:
  provider: "vllm"
  base_url: "http://localhost:8000/v1"
  # When accessed via ZeroTier, use the ZT IP instead:
  # base_url: "http://<zerotier_ip>:8000/v1"
  api_key_env: "VLLM_API_KEY"
  timeout_s: 120
  max_context: 65536
  structured_json_mode: true
  retries: 2
  backoff_s: 1.5

# API key for authentication (optional but recommended)
auth:
  api_key: ""    # Set via VLLM_API_KEY env var or here
