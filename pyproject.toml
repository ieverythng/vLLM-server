[project]
name = "vllm-server-gateway"
version = "0.1.0"
description = "Windows-native vLLM OpenAI-compatible gateway and validation harness."
requires-python = ">=3.11"
dependencies = [
  "vllm>=0.19.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "httpx>=0.27.0",
  "pydantic>=2.0.0",
  "pyyaml>=6.0",
  "openai>=1.0.0",
  "aiofiles>=24.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
  "respx>=0.21.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "gpu: starts or validates a real vLLM GPU backend",
]

[tool.ruff]
line-length = 120
target-version = "py311"
